<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ADS-B シミュレータ設定</title>
<!-- First draft generated by the local LLM (Ollama gpt-oss:20b) through
     adsb.ollama_assist, then reviewed and fixed (details in the commit message). -->
<style>
  :root{--bg:#fff;--fg:#111;--muted:#666;--line:#ccc;--accent:#0066cc;--dot:#d33;--ok:#1a7f37;--err:#c00}
  @media (prefers-color-scheme:dark){:root{--bg:#111;--fg:#eee;--muted:#999;--line:#444;--accent:#3399ff;--dot:#ff6b6b;--ok:#4ac26b;--err:#ff6b6b}}
  body{font-family:system-ui,-apple-system,"Hiragino Sans",sans-serif;margin:0;padding:1rem;background:var(--bg);color:var(--fg)}
  h1{margin:0 0 .5rem;font-size:1.3rem} h2{font-size:1.05rem;margin:1.2rem 0 .4rem}
  section{border-top:1px solid var(--line);padding-top:.4rem}
  .wrap{overflow-x:auto;max-width:100%}
  table{border-collapse:collapse;width:100%}
  th,td{border:1px solid var(--line);padding:3px 4px;text-align:center;white-space:nowrap}
  td input[type=text]{width:6.5em;background:transparent;color:inherit;border:1px solid var(--line)}
  input,select,textarea,button{font:inherit;max-width:100%}
  button{margin:2px;cursor:pointer}
  .row{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center;margin:.3rem 0}
  .row input[type=number]{width:7em}
  textarea{width:100%;box-sizing:border-box;font-family:ui-monospace,Menlo,monospace}
  #status{min-height:1.4em;margin:.4rem 0;font-weight:bold}
  #status.ok{color:var(--ok)} #status.error{color:var(--err)}
  #plot{width:100%;max-width:480px;height:auto;display:block;border:1px solid var(--line)}
  #plot text{fill:var(--fg);font-size:11px} #plot .ring{stroke:var(--muted);fill:none}
  #plot .dot{fill:var(--dot)} #plot .centre{fill:var(--accent)}
  .muted{color:var(--muted);overflow-wrap:anywhere}
</style>
</head>
<body>
<h1>ADS-B シミュレータ設定</h1>
<p class="muted">表で諸元を編集し「一括適用」で機体群をまとめて置き換えます。位置は時刻の経過に合わせて推測位置で更新されます。</p>
<div id="status" role="status"></div>

<section>
<h2>諸元表（編集用）</h2>
<div class="wrap">
  <table id="aircraft-table">
    <thead><tr>
      <th>選択</th><th>ICAO</th><th>呼出符号</th><th>緯度</th><th>経度</th>
      <th>高度ft</th><th>速度kt</th><th>針路°</th><th>昇降率ft/min</th><th>カテゴリ</th><th>削除</th>
    </tr></thead>
    <tbody></tbody>
  </table>
</div>
<div class="row">
  <button id="add-row">行追加</button>
  <button id="delete-selected">選択行削除</button>
  <button id="load-current">現在値を表へ読込</button>
  <button id="apply-all"><strong>一括適用</strong></button>
</div>
<div class="row">
  <label>項目
    <select id="batch-field">
      <option value="altitude_ft">高度ft</option>
      <option value="speed_kt">速度kt</option>
      <option value="track_deg">針路°</option>
      <option value="vertical_rate_fpm">昇降率ft/min</option>
      <option value="category">カテゴリ</option>
    </select>
  </label>
  <label>値 <input type="text" id="batch-value" size="8"></label>
  <button id="apply-batch">選択行に設定</button>
</div>
</section>

<section>
<h2>CSV</h2>
<p class="muted">列順：icao,callsign,lat,lon,altitude_ft,speed_kt,track_deg,vertical_rate_fpm,category（1行目のヘッダは任意）</p>
<textarea id="csv-text" rows="5"></textarea>
<div class="row">
  <button id="csv-replace">表に取り込み（置換）</button>
  <button id="csv-add">表に追加</button>
  <button id="csv-export">表をCSVに書き出し</button>
</div>
</section>

<section>
<h2>乱数生成</h2>
<div class="row">
  <label>機数 <input type="number" id="rand-count" min="0" max="500" value="20"></label>
  <label>中心緯度 <input type="number" id="rand-lat" step="0.0001" value="35.5494"></label>
  <label>中心経度 <input type="number" id="rand-lon" step="0.0001" value="139.7798"></label>
  <label>半径NM <input type="number" id="rand-radius" step="0.1" value="60"></label>
  <button id="rand-generate">乱数で生成</button>
</div>
</section>

<section>
<h2>現在の推測位置</h2>
<div class="muted"><span id="live-time"></span>　<span id="live-count"></span></div>
<svg id="plot" viewBox="0 0 400 400" role="img" aria-label="位置プロット（北が上）"></svg>
<div class="wrap">
  <table id="live-table">
    <thead><tr><th>ICAO</th><th>呼出符号</th><th>緯度</th><th>経度</th>
      <th>高度ft</th><th>速度kt</th><th>針路°</th><th>昇降率ft/min</th></tr></thead>
    <tbody></tbody>
  </table>
</div>
</section>

<script>
(() => {
  const FIELDS = ['icao','callsign','lat','lon','altitude_ft','speed_kt','track_deg','vertical_rate_fpm','category'];
  const NUMERIC = new Set(FIELDS.slice(2));
  const SVG_NS = 'http://www.w3.org/2000/svg';
  const $ = id => document.getElementById(id);
  const tableBody = document.querySelector('#aircraft-table tbody');
  const liveBody = document.querySelector('#live-table tbody');
  const plotSvg = $('plot');

  /* ---------- ユーティリティ ---------- */
  function say(msg, kind){ const s=$('status'); s.textContent=msg; s.className=kind||''; }
  async function fetchJson(url, opts={}) {
    const r = await fetch(url, opts);
    let body = null;
    try { body = await r.json(); } catch (_) { /* not JSON */ }
    if (!r.ok) throw new Error((body && body.error) || `HTTP ${r.status}`);
    return body;
  }
  const show = v => (v === undefined || v === null) ? '' : String(v);   // keep 0 (LLM draft used v||'')

  /* ---------- 行操作 ---------- */
  function addRow(data={}) {
    const tr = document.createElement('tr');
    const chkTd = document.createElement('td');
    const chk = document.createElement('input'); chk.type='checkbox'; chk.className='sel';
    chkTd.appendChild(chk); tr.appendChild(chkTd);
    FIELDS.forEach(f => {
      const td = document.createElement('td');
      const inp = document.createElement('input');
      inp.type='text'; inp.dataset.field=f; inp.value=show(data[f]);
      if (NUMERIC.has(f)) inp.inputMode='decimal';
      td.appendChild(inp); tr.appendChild(td);
    });
    const delTd = document.createElement('td');
    const del = document.createElement('button'); del.textContent='削除';
    del.addEventListener('click', () => tr.remove());
    delTd.appendChild(del); tr.appendChild(delTd);
    tableBody.appendChild(tr);
  }
  const getRows = () => Array.from(tableBody.children);
  const cell = (tr, f) => tr.querySelector(`input[data-field="${f}"]`);
  const rowValues = tr => FIELDS.map(f => cell(tr, f).value.trim());

  $('add-row').addEventListener('click', () => addRow());
  $('delete-selected').addEventListener('click', () => getRows().filter(r => r.querySelector('.sel').checked).forEach(r => r.remove()));

  /* ---------- 選択行への一括値設定 ---------- */
  $('apply-batch').addEventListener('click', () => {
    const f = $('batch-field').value, v = $('batch-value').value.trim();
    const rows = getRows().filter(r => r.querySelector('.sel').checked);
    if (v === '' || !rows.length) return say('値と対象の行（選択）を指定してください', 'error');
    rows.forEach(r => { cell(r, f).value = v; });
    say(`${rows.length}行に設定しました（「一括適用」で反映）`, 'ok');
  });

  /* ---------- 一括適用（PUT /api/aircraft） ---------- */
  $('apply-all').addEventListener('click', async () => {
    const aircraft = getRows().map(tr => {
      const ac = {};
      FIELDS.forEach(f => {
        const v = cell(tr, f).value.trim();
        if (v !== '') ac[f] = NUMERIC.has(f) ? Number(v) : v;   // Number('abc') -> NaN -> server error
      });
      return ac;
    });
    try {
      const r = await fetchJson('/api/aircraft', {method:'PUT', headers:{'Content-Type':'application/json'},
                                                  body: JSON.stringify({aircraft})});
      say(`${r.count}機を適用しました`, 'ok');
    } catch (e) { say(`適用できません：${e.message}`, 'error'); }
  });

  /* ---------- CSV ---------- */
  function parseCSV(text) {
    const rows = [], bad = [];
    text.split(/\r?\n/).forEach((line, i) => {
      line = line.trim();
      if (!line || (rows.length === 0 && bad.length === 0 && /^icao\b/i.test(line))) return;
      const cols = line.split(',').map(s => s.trim());
      if (cols.length < 4 || cols.length > FIELDS.length) { bad.push(i + 1); return; }
      const ac = {}; FIELDS.forEach((f, k) => { ac[f] = cols[k]; }); rows.push(ac);
    });
    return {rows, bad};
  }
  function importCSV(replace) {
    const {rows, bad} = parseCSV($('csv-text').value);
    if (bad.length) return say(`CSVの列数が不正な行があります（${bad.join(', ')}行目）`, 'error');
    if (replace) tableBody.replaceChildren();
    rows.forEach(addRow);
    say(`${rows.length}行を表に取り込みました（「一括適用」で反映）`, 'ok');
  }
  $('csv-replace').addEventListener('click', () => importCSV(true));
  $('csv-add').addEventListener('click', () => importCSV(false));
  $('csv-export').addEventListener('click', () => {
    $('csv-text').value = [FIELDS.join(','), ...getRows().map(r => rowValues(r).join(','))].join('\n');
  });

  /* ---------- 現在値を表へ読込 ---------- */
  async function loadCurrent() {
    try {
      const data = await fetchJson('/api/aircraft');
      tableBody.replaceChildren();
      data.aircraft.forEach(addRow);
      say(`現在の${data.aircraft.length}機を表に読み込みました`, 'ok');
    } catch (e) { say(`読み込めません：${e.message}`, 'error'); }
  }
  $('load-current').addEventListener('click', loadCurrent);

  /* ---------- 乱数生成 ---------- */
  $('rand-generate').addEventListener('click', async () => {
    const body = {count: Number($('rand-count').value), lat: Number($('rand-lat').value),
                  lon: Number($('rand-lon').value), radius_nm: Number($('rand-radius').value)};
    try {
      const r = await fetchJson('/api/aircraft/random', {method:'POST', headers:{'Content-Type':'application/json'},
                                                         body: JSON.stringify(body)});
      await loadCurrent();
      say(`${r.count}機を乱数で生成しました`, 'ok');
    } catch (e) { say(`生成できません：${e.message}`, 'error'); }
  });

  /* ---------- ライブ表示とプロット（1回のGETで両方更新） ---------- */
  function svg(tag, attrs, text) {
    const el = document.createElementNS(SVG_NS, tag);
    Object.entries(attrs).forEach(([k, v]) => el.setAttribute(k, v));
    if (text !== undefined) el.textContent = text;
    return el;
  }
  function drawPlot(data) {
    const c = data.centre, R = data.radius_nm, cx = 200, cy = 200;
    const scale = 180 / Math.max(R, 1);                 // px per NM: the radius fills the view
    const coslat = Math.cos(c.lat * Math.PI / 180);
    const parts = [svg('circle', {cx, cy, r: R * scale, class: 'ring'}),
                   svg('circle', {cx, cy, r: R * scale / 2, class: 'ring', 'stroke-dasharray': '3 3'}),
                   svg('circle', {cx, cy, r: 3, class: 'centre'}),
                   svg('text', {x: cx + 4, y: 14}, 'N'),
                   svg('text', {x: 4, y: 396}, `半径 ${R} NM`)];
    data.aircraft.forEach(ac => {
      // equirectangular approximation in NM (1° lat = 60 NM); the LLM draft mixed degrees and NM
      const x = cx + (ac.lon - c.lon) * 60 * coslat * scale;
      const y = cy - (ac.lat - c.lat) * 60 * scale;
      parts.push(svg('circle', {cx: x, cy: y, r: 3, class: 'dot'}));
      parts.push(svg('text', {x: x + 5, y: y - 4}, ac.callsign || ac.icao));
    });
    plotSvg.replaceChildren(...parts);
  }
  function drawLive(data) {
    $('live-time').textContent = `シミュレーション時刻 ${data.time} 秒`;
    $('live-count').textContent = `${data.aircraft.length}機`;
    liveBody.replaceChildren(...data.aircraft.map(ac => {
      const tr = document.createElement('tr');
      ['icao','callsign','lat','lon','altitude_ft','speed_kt','track_deg','vertical_rate_fpm'].forEach(k => {
        const td = document.createElement('td'); td.textContent = show(ac[k]); tr.appendChild(td);
      });
      return tr;
    }));
  }
  let busy = false;
  async function refresh() {
    if (busy) return;
    busy = true;
    try { const data = await fetchJson('/api/aircraft'); drawLive(data); drawPlot(data); }
    catch (_) { $('live-time').textContent = '接続できません'; }
    finally { busy = false; }
  }
  setInterval(refresh, 1000);
  refresh();
  loadCurrent();
})();
</script>
</body>
</html>
