name: test
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.9 is the python3 that ships with macOS (Command Line Tools)
        python-version: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '${{ matrix.python-version }}'}
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python -m adsb.simulator --count 5 --seconds 10 --seed 1 --iq traffic.cu8 --noise 0.03
      - run: python -m adsb.receiver --iq traffic.cu8 --quiet
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Two outputs at once: $PADSB/TCP (eNMEA2000) and AIS Type 9/UDP (iPad stand-in).
      - run: python3 scripts/wait_padsb.py 10111 5 > padsb.log &
      - run: python3 scripts/wait_padsb.py 10110 5 udp '!AIVDM,' > ais9.log &
      - run: docker compose up -d --build --wait
        env:
          ADSB_OUTPUTS: tcp://host.docker.internal:10111,udp://host.docker.internal:10110/ais9
      - run: |
          for i in $(seq 60); do grep -q '^OK:' padsb.log && grep -q '^OK:' ais9.log && break; sleep 2; done
          cat padsb.log ais9.log
          grep -q '^OK:' padsb.log && grep -q '^OK:' ais9.log
      - if: always()
        run: docker compose logs --tail=50
      - if: always()
        run: docker compose down
